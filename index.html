<html lang="en">
<head>

<style>
  :root{
    --ink:#1c1b19; --paper:#faf8f4; --line:#d9d4c8;
    --accent:#3a5a40; --accent-soft:#e7efe6; --warn:#8a3b2d; --muted:#7a756a;
    --card-bg:#fff; --warn-soft:#f6e6e1; --line-soft:#efece4;
  }
  body.dark{
    --ink:#f0eee8; --paper:#17171a; --line:#3a3a3f;
    --accent:#7fb894; --accent-soft:#243228; --warn:#e08c74; --muted:#a3a09a;
    --card-bg:#232326; --warn-soft:#3a2621; --line-soft:#2e2e32;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Iowan Old Style','Georgia',serif;line-height:1.45;}
  .wrap{max-width:640px;margin:0 auto;padding:28px 20px 80px;}
  h1{font-size:1.5rem;font-weight:600;letter-spacing:-0.01em;margin:0 0 2px;}
  h2{font-size:1.15rem;font-weight:600;margin:0 0 14px;}
  .sub{color:var(--muted);font-size:0.92rem;margin:0 0 24px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
  .card{background:var(--card-bg);border:1px solid var(--line);border-radius:2px;padding:20px;margin-bottom:16px;}
  label{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:0.82rem;color:var(--muted);display:block;margin-bottom:4px;}
  input[type=text],input[type=email],input[type=password],input.plain{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:1rem;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:4px;
    background:var(--card-bg);color:var(--ink);margin-bottom:14px;
  }
  input:focus{outline:2px solid var(--accent-soft);border-color:var(--accent);}
  .btn{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:var(--accent);color:#fff;border:none;border-radius:4px;
    padding:12px 16px;font-size:0.95rem;font-weight:600;cursor:pointer;width:100%;
  }
  .btn.secondary{background:none;border:1px solid var(--line);color:var(--ink);}
  .btn.small{width:auto;padding:6px 12px;font-size:0.82rem;}
  .btn.danger{background:none;color:var(--warn);border:1px solid var(--warn);}
  .link{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--accent);font-size:0.88rem;text-align:center;margin-top:10px;cursor:pointer;text-decoration:underline;}
  .error{color:var(--warn);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:0.85rem;margin:-8px 0 12px;}
  .notice{color:var(--accent);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:0.85rem;margin:-8px 0 12px;}

  .topbar{display:flex;justify-content:space-between;align-items:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;margin-bottom:18px;}
  .topbar .greet{font-size:0.85rem;color:var(--muted);}
  .backlink{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--accent);font-size:0.9rem;cursor:pointer;margin-bottom:14px;display:inline-block;}

  .bar-outer{height:5px;background:var(--line-soft);border-radius:3px;margin-top:8px;overflow:hidden;}
  .bar-inner{height:100%;background:var(--accent);transition:width 0.3s ease;}
  .summary-row{display:flex;justify-content:space-between;align-items:baseline;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
  .summary-big{font-size:2rem;font-weight:700;font-variant-numeric:tabular-nums;}
  .summary-target{color:var(--muted);font-size:0.85rem;}

  .course{border:1px solid var(--line);border-radius:2px;margin-bottom:14px;overflow:hidden;background:var(--card-bg);}
  .course-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;cursor:pointer;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
  .course-name{font-weight:600;font-size:1rem;}
  .course-meta{font-size:0.78rem;color:var(--muted);}
  .course-target{font-size:0.76rem;color:var(--accent);margin-top:2px;}
  .edit-icon{opacity:0.6;font-size:0.7rem;}
  .course-need{text-align:right;}
  .need-pct{font-size:1.2rem;font-weight:700;font-variant-numeric:tabular-nums;}
  .need-label{font-size:0.7rem;color:var(--muted);}
  .field-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line-soft);font-size:0.9rem;gap:10px;}
  .field-row:last-of-type{border-bottom:none;}
  .field-name{flex:1;min-width:0;}
  .field-weight{color:var(--muted);font-size:0.78rem;display:block;}
  .field-hint{color:var(--accent);font-size:0.76rem;margin-top:2px;}
  .field-input{display:flex;align-items:center;gap:4px;flex-shrink:0;}
  .field-input input{width:56px;font-size:0.95rem;font-weight:600;text-align:right;padding:4px 6px;border:1px solid var(--line);border-radius:3px;font-family:inherit;margin:0;}
  .field-input span{color:var(--muted);font-size:0.82rem;}
  .remove-x{color:var(--muted);font-size:0.9rem;cursor:pointer;padding:0 4px;}
  .lock-btn{background:none;border:1px solid var(--line);border-radius:3px;padding:3px 8px;font-size:0.72rem;color:var(--muted);cursor:pointer;margin-left:10px;white-space:nowrap;}
  .lock-btn.locked{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
  .rebalance{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:0.82rem;color:var(--muted);padding:14px;}
  .rebalance strong{color:var(--ink);}
  .add-row{display:flex;gap:8px;margin-top:12px;}
  .add-row input{margin-bottom:0;}
  .add-row input.name{flex:2;}
  .add-row input.num{flex:1;}
  .archive-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line-soft);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:0.9rem;}
  .archive-row:last-child{border-bottom:none;}
  .spinner{font-family:-apple-system,sans-serif;color:var(--muted);font-size:0.9rem;text-align:center;padding:40px 0;}
  footer{text-align:center;color:var(--muted);font-size:0.75rem;margin-top:30px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}

  #themeToggle{
    position:fixed;top:14px;right:14px;z-index:100;
    width:38px;height:38px;border-radius:50%;
    background:var(--card-bg);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;font-size:1.1rem;
  }
  .pw-wrap{position:relative;}
  .pw-wrap input{padding-right:44px;}
  .pw-toggle{
    position:absolute;right:10px;top:50%;transform:translateY(-50%);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:0.76rem;color:var(--accent);cursor:pointer;user-select:none;
    margin-top:-7px;
  }
</style>

<body>
<div id="themeToggle" title="Toggle dark mode">🌙</div>
<div class="wrap" id="app"><div class="spinner">Loading…</div></div>

<script>
/* =========================================================================
   FIREBASE SETUP — replace this config with your own project's config.
   Create a project (e.g. "myscore-xxxx") at console.firebase.google.com,
   enable Authentication → Email/Password, and enable Firestore Database.
   ========================================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyD5kUBNFXBl5FG_MNd5_In68h38RDMzqUs",
  authDomain: "my-score-75e1c.firebaseapp.com",
  projectId: "my-score-75e1c",
  storageBucket: "my-score-75e1c.firebasestorage.app",
  messagingSenderId: "420210815974",
  appId: "1:420210815974:web:cdca0c387773d91497dc27"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

/* Firestore layout:
   users/{uid}                -> { name, overallTarget, goalsEnabled, courses:[...] }  (live working data)
   users/{uid}/archives/{id}  -> { name, savedAt, overallTarget, goalsEnabled, courses:[...] } (saved snapshots)
*/

/* ---------- theme (dark mode) ---------- */
(function initTheme(){
  const saved = localStorage.getItem('myscore_theme');
  if(saved==='dark'){ document.body.classList.add('dark'); }
  updateThemeIcon();
})();
function updateThemeIcon(){
  document.getElementById('themeToggle').textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';
}
document.getElementById('themeToggle').onclick = ()=>{
  document.body.classList.toggle('dark');
  localStorage.setItem('myscore_theme', document.body.classList.contains('dark') ? 'dark' : 'light');
  updateThemeIcon();
};

/* ---------- app state ---------- */
let currentUser = null;   // firebase auth user object
let data = null;          // live working data, mirrors the old localStorage shape
let openCourseId = null;
let openArchiveView = false;
let uidCounter = 1;
function uid(){ return 'x'+(uidCounter++)+'_'+Date.now().toString(36); }

let saveTimer = null;
function persist(){
  // debounced write — avoids hitting Firestore on every single keystroke
  if(!currentUser || !data) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    db.collection('users').doc(currentUser.uid).set(data, {merge:false}).catch(err=>{
      console.error('Save failed:', err);
    });
  }, 500);
}

/* ---------- math (unchanged from the validated demo) ---------- */
function totalCredits(){ return data.courses.reduce((s,c)=>s+Number(c.credits||0),0) || 1; }

function courseStatus(course){
  let knownPoints=0, knownWeight=0, totalWeightAll=0;
  course.items.forEach(it=>{
    totalWeightAll += Number(it.weight)||0;
    if(it.score!==null && it.score!==undefined && it.score!==''){
      const rawMax = Number(it.rawMax)||1;
      const clampedScore = Math.max(0, Math.min(rawMax, Number(it.score)));
      const contribution = (clampedScore/rawMax) * (Number(it.weight)||0);
      knownPoints += contribution;
      knownWeight += Number(it.weight)||0;
    }
  });
  return {knownPoints, knownWeight, totalWeightAll, remainingWeight: totalWeightAll-knownWeight};
}

function courseProjected(course){
  if(course.locked && course.lockedValue!==null) return course.lockedValue;
  const {knownPoints, knownWeight} = courseStatus(course);
  if(knownWeight===0) return null;
  return (knownPoints/knownWeight)*100;
}

function computeAutoTarget(overallTarget){
  let fixedCredits=0, fixedPoints=0, autoCredits=0;
  data.courses.forEach(c=>{
    if(c.locked && c.lockedValue!==null){ fixedCredits+=Number(c.credits); fixedPoints += (c.lockedValue/100)*Number(c.credits); }
    else if(c.targetOverride!==null && c.targetOverride!==undefined){ fixedCredits+=Number(c.credits); fixedPoints += (Number(c.targetOverride)/100)*Number(c.credits); }
    else { autoCredits+=Number(c.credits); }
  });
  if(autoCredits===0) return null;
  const neededPoints = (overallTarget/100)*totalCredits() - fixedPoints;
  return (neededPoints/autoCredits)*100;
}

function courseTargetFor(course, autoTarget){
  if(course.locked && course.lockedValue!==null) return course.lockedValue;
  if(course.targetOverride!==null && course.targetOverride!==undefined) return Number(course.targetOverride);
  return autoTarget;
}

const PASS_MARK = 50;
function targetIsUnsafe(courseTarget){ return courseTarget!==null && courseTarget < PASS_MARK; }

function requiredForRemainingItems(course, courseTargetPct){
  const {knownPoints, totalWeightAll, remainingWeight} = courseStatus(course);
  const result = {};
  if(remainingWeight<=0 || totalWeightAll<=0) return result;
  const requiredTotalPoints = (courseTargetPct/100)*totalWeightAll;
  const neededFromRemaining = requiredTotalPoints - knownPoints;
  const requiredRate = neededFromRemaining/remainingWeight;
  course.items.forEach((it,i)=>{
    if(it.score===null || it.score===undefined || it.score===''){
      result[i] = { rawNeeded: requiredRate*(Number(it.rawMax)||0), rate: requiredRate };
    }
  });
  return result;
}

/* ---------- rendering ---------- */
const app = document.getElementById('app');

function render(){
  if(!currentUser){ renderAuth(); return; }
  if(!currentUser.emailVerified){ renderVerifyEmail(); return; }
  if(!data){ app.innerHTML = '<div class="spinner">Loading your data…</div>'; return; }
  if(openArchiveView){ renderArchives(); return; }
  if(openCourseId){ renderCourseDetail(openCourseId); return; }
  renderDashboard();
}

/* ---- Auth screens ---- */
function renderAuth(mode){
  mode = mode || 'login';
  app.innerHTML = `
    <h1>MyScore</h1>
    <p class="sub">Your personal semester goal tracker.</p>
    <div class="card">
      <h2>${mode==='login' ? 'Log in' : 'Create your account'}</h2>
      <div id="authError" class="error" style="display:none;"></div>
      ${mode==='signup' ? `<label>Name</label><input type="text" id="authName" placeholder="Your name">` : ''}
      <label>Email</label>
      <input type="email" id="authEmail" placeholder="you@example.com">
      <label>Password</label>
      <div class="pw-wrap">
        <input type="password" id="authPassword" placeholder="••••••••">
        <span class="pw-toggle" id="pwToggle">show</span>
      </div>
      <button class="btn" id="authSubmit">${mode==='login' ? 'Log in' : 'Sign up'}</button>
      <div class="link" id="authSwitch">${mode==='login' ? "No account? Sign up" : "Already have an account? Log in"}</div>
    </div>
    <footer>Connected to Firebase — your account and marks are stored securely under your login.</footer>
  `;
  document.getElementById('pwToggle').onclick = ()=>{
    const inp = document.getElementById('authPassword');
    const isHidden = inp.type==='password';
    inp.type = isHidden ? 'text' : 'password';
    document.getElementById('pwToggle').textContent = isHidden ? 'hide' : 'show';
  };
  document.getElementById('authSwitch').onclick = ()=> renderAuth(mode==='login' ? 'signup' : 'login');
  document.getElementById('authSubmit').onclick = ()=>{
    const email = document.getElementById('authEmail').value.trim();
    const pw = document.getElementById('authPassword').value;
    const errEl = document.getElementById('authError');
    errEl.style.display='none';
    if(!email || !pw){ errEl.textContent='Enter an email and password.'; errEl.style.display='block'; return; }

    if(mode==='signup'){
      const name = document.getElementById('authName').value.trim();
      if(!name){ errEl.textContent='Enter your name.'; errEl.style.display='block'; return; }
      auth.createUserWithEmailAndPassword(email, pw).then(cred=>{
        return cred.user.sendEmailVerification().then(()=>{
          return db.collection('users').doc(cred.user.uid).set({ name, overallTarget:80, goalsEnabled:false, courses:[] });
        });
      }).catch(err=>{ errEl.textContent = err.message; errEl.style.display='block'; });
    } else {
      auth.signInWithEmailAndPassword(email, pw).catch(err=>{
        errEl.textContent = 'Incorrect email or password.'; errEl.style.display='block';
      });
    }
  };
}

function renderVerifyEmail(){
  app.innerHTML = `
    <h1>MyScore</h1>
    <div class="card">
      <h2>Verify your email</h2>
      <p style="font-family:-apple-system,sans-serif;font-size:0.9rem;color:var(--ink);">
        We sent a verification link to <strong>${currentUser.email}</strong>. Open it, then come back and tap below.
      </p>
      <p style="font-family:-apple-system,sans-serif;font-size:0.82rem;color:var(--muted);">
        Didn't get it? Check your spam or junk folder — verification emails sometimes land there.
      </p>
      <div id="verifyNotice" class="notice" style="display:none;"></div>
      <button class="btn" id="checkVerifiedBtn">I've verified — continue</button>
      <button class="btn secondary" id="resendBtn" style="margin-top:10px;">Resend verification email</button>
      <div class="link" id="signOutFromVerify">Log out</div>
    </div>
  `;
  document.getElementById('checkVerifiedBtn').onclick = async ()=>{
    await currentUser.reload();
    currentUser = auth.currentUser;
    if(currentUser.emailVerified){ loadUserData(); }
    else {
      const n = document.getElementById('verifyNotice');
      n.textContent = 'Still not verified — check your inbox (and spam folder).';
      n.style.display='block';
    }
  };
  document.getElementById('resendBtn').onclick = ()=>{
    currentUser.sendEmailVerification().then(()=>{
      const n = document.getElementById('verifyNotice');
      n.textContent = 'Verification email resent.';
      n.style.display='block';
    });
  };
  document.getElementById('signOutFromVerify').onclick = ()=> auth.signOut();
}

function loadUserData(){
  db.collection('users').doc(currentUser.uid).get().then(docSnap=>{
    if(docSnap.exists){ data = docSnap.data(); }
    else { data = { overallTarget:80, goalsEnabled:false, courses:[] }; db.collection('users').doc(currentUser.uid).set(data); }
    if(data.goalsEnabled===undefined) data.goalsEnabled=false;
    if(!data.courses) data.courses=[];
    render();
  }).catch(err=>{
    app.innerHTML = `<div class="card"><p style="font-family:-apple-system,sans-serif;color:var(--warn);">Couldn't load your data: ${err.message}</p></div>`;
  });
}

/* ---- Dashboard ---- */
function renderDashboard(){
  const goalsOn = !!data.goalsEnabled;

  const goalCardHtml = goalsOn ? `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <label style="margin-bottom:0;">Semester target</label>
        <span class="link" id="disableGoalsBtn" style="margin:0;font-size:0.76rem;">turn off goal tracking</span>
      </div>
      <div style="display:flex;align-items:baseline;gap:4px;">
        <input class="plain" id="targetInput" inputmode="decimal" style="width:80px;margin-bottom:0;font-size:1.4rem;font-weight:600;border:none;border-bottom:2px solid var(--accent);border-radius:0;padding:2px 0;" value="${data.overallTarget}">
        <span style="font-family:-apple-system,sans-serif;color:var(--muted);font-size:1.1rem;">%</span>
      </div>
      <div class="bar-outer"><div class="bar-inner" id="overallBar" style="width:0%"></div></div>
      <div class="summary-row" style="margin-top:10px;">
        <div><div class="summary-big" id="overallProjected">—</div><div class="summary-target">projected cumulative</div></div>
        <div style="text-align:right;"><div class="summary-target" id="overallStatusText">enter your marks below</div></div>
      </div>
    </div>
  ` : `
    <div class="card">
      <div style="font-family:-apple-system,sans-serif;font-size:0.9rem;color:var(--ink);margin-bottom:4px;">Just tracking marks — no goal set yet.</div>
      <div style="font-family:-apple-system,sans-serif;font-size:0.85rem;color:var(--muted);margin-bottom:12px;">
        <span class="summary-big" id="overallProjected" style="font-size:1.6rem;">—</span> projected cumulative, based on real marks only.
      </div>
      <button class="btn secondary" id="enableGoalsBtn">Set a semester goal</button>
    </div>
  `;

  app.innerHTML = `
    <div class="topbar">
      <div class="greet">Hi, ${data.name||currentUser.email}</div>
      <div class="link" id="logoutBtn" style="margin:0;">Log out</div>
    </div>
    <h1>MyScore</h1>
    <p class="sub">${goalsOn ? "Set your semester target, build each course your own way, and track what's still needed." : "Add your courses, log marks as they come in, and see your running percentage. Goals are optional."}</p>

    ${goalCardHtml}

    <div id="courseList"></div>
    <button class="btn secondary" id="addCourseBtn">+ Add course</button>

    <div class="card" id="rebalanceCard" style="display:none;margin-top:16px;"></div>

    <button class="btn secondary" id="saveArchiveBtn" style="margin-top:20px;">Save this semester as a record</button>
    <div id="saveArchiveForm"></div>
    <div class="link" id="viewArchivesBtn">View saved semesters</div>

    <div class="link" id="deleteDataBtn" style="margin-top:24px;color:var(--warn);">Delete all my data</div>
    <div id="deleteDataConfirm"></div>

    <footer>Every course is built your own way — add whatever components it actually has.</footer>
  `;

  document.getElementById('logoutBtn').onclick = ()=> auth.signOut();
  document.getElementById('viewArchivesBtn').onclick = ()=>{ openArchiveView=true; render(); };

  document.getElementById('saveArchiveBtn').onclick = ()=>{
    document.getElementById('saveArchiveForm').innerHTML = `
      <div class="card" style="margin-top:10px;">
        <label>Name this record</label>
        <input type="text" class="plain" id="archiveName" placeholder="e.g. Year 1, Semester 1">
        <button class="btn" id="confirmSaveArchive">Save record</button>
      </div>
    `;
    document.getElementById('confirmSaveArchive').onclick = ()=>{
      const name = document.getElementById('archiveName').value.trim();
      if(!name) return;
      const snapshot = {
        name,
        savedAt: firebase.firestore.FieldValue.serverTimestamp(),
        overallTarget: data.overallTarget,
        goalsEnabled: data.goalsEnabled,
        courses: JSON.parse(JSON.stringify(data.courses))
      };
      db.collection('users').doc(currentUser.uid).collection('archives').add(snapshot).then(()=>{
        document.getElementById('saveArchiveForm').innerHTML = `<div class="notice" style="margin-top:10px;">Saved. Your live courses are untouched — this is just a snapshot.</div>`;
      }).catch(err=>{
        document.getElementById('saveArchiveForm').innerHTML = `<div class="error" style="margin-top:10px;">Couldn't save: ${err.message}</div>`;
      });
    };
  };

  if(goalsOn){
    document.getElementById('disableGoalsBtn').onclick = ()=>{ data.goalsEnabled=false; persist(); render(); };
    document.getElementById('targetInput').addEventListener('input', ()=>{
      const el = document.getElementById('targetInput');
      const cleaned = el.value.replace(/[^0-9.]/g,'');
      if(cleaned!==el.value) el.value=cleaned;
      data.overallTarget = parseFloat(cleaned)||0;
      persist();
      updateDashboardComputed();
    });
  } else {
    document.getElementById('enableGoalsBtn').onclick = ()=>{ data.goalsEnabled=true; persist(); render(); };
  }

  document.getElementById('deleteDataBtn').onclick = ()=>{
    document.getElementById('deleteDataConfirm').innerHTML = `
      <div class="card" style="border-color:var(--warn);background:var(--warn-soft);margin-top:8px;">
        <div style="font-family:-apple-system,sans-serif;font-size:0.88rem;color:var(--ink);margin-bottom:10px;">
          This permanently deletes your account and all course data, including saved records. This can't be undone.
        </div>
        <div style="display:flex;gap:10px;">
          <button class="btn danger" id="confirmDeleteData" style="flex:1;">Yes, delete everything</button>
          <button class="btn secondary" id="cancelDeleteData" style="flex:1;">Cancel</button>
        </div>
      </div>
    `;
    document.getElementById('confirmDeleteData').onclick = async ()=>{
      try{
        const archivesSnap = await db.collection('users').doc(currentUser.uid).collection('archives').get();
        const batch = db.batch();
        archivesSnap.forEach(d=>batch.delete(d.ref));
        batch.delete(db.collection('users').doc(currentUser.uid));
        await batch.commit();
        await currentUser.delete();
      }catch(err){
        // if delete requires recent login, Firebase will throw — surface it plainly
        document.getElementById('deleteDataConfirm').innerHTML = `<div class="error">Couldn't fully delete: ${err.message}. Try logging out and back in, then delete again.</div>`;
      }
    };
    document.getElementById('cancelDeleteData').onclick = ()=>{ document.getElementById('deleteDataConfirm').innerHTML=''; };
  };

  document.getElementById('addCourseBtn').onclick = ()=>{
    const c = { id:uid(), name:'New course', credits:10, targetOverride:null, locked:false, lockedValue:null, items:[] };
    data.courses.push(c);
    persist();
    openCourseId = c.id;
    render();
  };

  buildCourseCards();
  updateDashboardComputed();
}

function buildCourseCards(){
  const goalsOn = !!data.goalsEnabled;
  const listEl = document.getElementById('courseList');
  listEl.innerHTML='';
  data.courses.forEach(course=>{
    const div = document.createElement('div');
    div.className='course';
    div.innerHTML = `
      <div class="course-head" data-id="${course.id}">
        <div>
          <div class="course-name">${course.name}</div>
          <div class="course-meta" id="meta-${course.id}">${course.credits} credits</div>
          ${goalsOn ? `<div class="course-target" id="target-${course.id}"></div>` : ''}
          <div id="retakeflag-${course.id}"></div>
        </div>
        <div class="course-need">
          <div class="need-pct" id="need-${course.id}">—</div>
          <div class="need-label" id="needlabel-${course.id}">projected</div>
        </div>
      </div>
    `;
    listEl.appendChild(div);
    div.querySelector('.course-head').addEventListener('click', ()=>{ openCourseId = course.id; render(); });
  });
}

function updateDashboardComputed(){
  const goalsOn = !!data.goalsEnabled;
  const target = data.overallTarget;
  const autoTarget = goalsOn ? computeAutoTarget(target) : null;
  let totalKnownPoints=0, totalKnownCredits=0;

  data.courses.forEach(course=>{
    const projected = courseProjected(course);
    const courseTarget = goalsOn ? courseTargetFor(course, autoTarget) : null;
    const hasRealMarks = courseStatus(course).knownWeight > 0;
    const needEl = document.getElementById('need-'+course.id);
    const labelEl = document.getElementById('needlabel-'+course.id);
    const metaEl = document.getElementById('meta-'+course.id);
    const targetEl = document.getElementById('target-'+course.id);
    if(!needEl) return;

    if(course.locked){
      needEl.textContent = course.lockedValue.toFixed(0)+'%';
      labelEl.textContent = 'final result';
      metaEl.textContent = course.credits + ' credits · locked';
      needEl.style.color = course.lockedValue<50 ? 'var(--warn)' : 'var(--ink)';
    } else if(projected!==null){
      needEl.textContent = projected.toFixed(0)+'%';
      labelEl.textContent='projected so far';
      needEl.style.color = projected<50 ? 'var(--warn)' : 'var(--ink)';
      metaEl.textContent = course.credits + ' credits';
    } else if(!goalsOn){
      needEl.textContent = '—'; labelEl.textContent = 'no marks yet'; needEl.style.color='var(--ink)';
      metaEl.textContent = course.credits + ' credits';
    } else if(courseTarget!==null && courseTarget>100){
      needEl.textContent = 'not possible'; labelEl.textContent='with current courses'; needEl.style.color='var(--warn)';
      metaEl.textContent = course.credits + ' credits';
    } else if(courseTarget!==null && courseTarget<0){
      needEl.textContent = 'already clear'; labelEl.textContent='target already secured'; needEl.style.color='var(--accent)';
      metaEl.textContent = course.credits + ' credits';
    } else if(hasRealMarks && targetIsUnsafe(courseTarget)){
      needEl.textContent = courseTarget.toFixed(0)+'% *'; labelEl.textContent='enough for GPA — not enough to pass'; needEl.style.color='var(--warn)';
      metaEl.textContent = course.credits + ' credits';
    } else {
      needEl.textContent = courseTarget!==null ? courseTarget.toFixed(0)+'%' : '—'; labelEl.textContent='target for this course'; needEl.style.color='var(--ink)';
      metaEl.textContent = course.credits + ' credits';
    }

    if(goalsOn && targetEl){
      const val = course.locked ? course.lockedValue : (course.targetOverride!==null && course.targetOverride!==undefined ? Number(course.targetOverride) : autoTarget);
      let stateLabel;
      if(course.locked) stateLabel = '<span class="edit-icon">(locked)</span>';
      else if(course.targetOverride!==null && course.targetOverride!==undefined) stateLabel = '<span class="edit-icon">(set)</span>';
      else stateLabel = '<span class="edit-icon">(auto)</span>';
      targetEl.innerHTML = `target: ${val!==null ? val.toFixed(0)+'%' : '—'} ${stateLabel}`;
    }

    const flagEl = document.getElementById('retakeflag-'+course.id);
    if(flagEl){
      const currentPct = course.locked ? course.lockedValue : projected;
      flagEl.innerHTML = (currentPct!==null && currentPct<50) ? `<span style="font-family:-apple-system,sans-serif;font-size:0.72rem;color:var(--warn);">⚠ retake risk</span>` : '';
    }
    if(projected!==null){ totalKnownPoints += (projected/100)*Number(course.credits); totalKnownCredits += Number(course.credits); }
  });

  const overallProjected = totalKnownCredits>0 ? (totalKnownPoints/totalKnownCredits)*100 : null;
  const opEl = document.getElementById('overallProjected');
  if(opEl) opEl.textContent = overallProjected!==null ? overallProjected.toFixed(1)+'%' : '—';

  if(goalsOn){
    const bar = document.getElementById('overallBar');
    if(bar) bar.style.width = overallProjected!==null ? Math.min(100,overallProjected)+'%' : '0%';
    const statusEl = document.getElementById('overallStatusText');
    if(statusEl){
      if(overallProjected===null){ statusEl.textContent='log marks to see your trajectory'; statusEl.style.color='var(--muted)'; }
      else if(overallProjected>=target){ statusEl.textContent='on track for your target'; statusEl.style.color='var(--accent)'; }
      else { statusEl.textContent=`${(target-overallProjected).toFixed(1)} pts behind target`; statusEl.style.color='var(--warn)'; }
    }
    const lockedOrOverriddenBelow = data.courses.filter(c=>{
      const v = c.locked ? c.lockedValue : c.targetOverride;
      return v!==null && v!==undefined && Number(v) < target && (c.locked || c.targetOverride!==null);
    });
    const rebalanceCard = document.getElementById('rebalanceCard');
    if(rebalanceCard){
      if(lockedOrOverriddenBelow.length>0 && autoTarget!==null){
        rebalanceCard.style.display='block';
        const names = lockedOrOverriddenBelow.map(c=>c.name).join(' and ');
        if(autoTarget>100){
          rebalanceCard.innerHTML = `<div class="rebalance"><strong style="color:var(--warn);">Not achievable with your current course list.</strong> Since <strong>${names}</strong> ${lockedOrOverriddenBelow.length>1?'are':'is'} set below target, the rest would need an average of ${autoTarget.toFixed(0)}% — above 100%. Add remaining courses, or raise ${names}'s target, to make ${target}% reachable.</div>`;
        } else if(autoTarget<0){
          rebalanceCard.innerHTML = `<div class="rebalance">Good news — <strong>${names}</strong> already secures more than your ${target}% target on its own.</div>`;
        } else {
          rebalanceCard.innerHTML = `<div class="rebalance">Since <strong>${names}</strong> ${lockedOrOverriddenBelow.length>1?'are':'is'} set below target, your remaining courses now need an average of <strong>${autoTarget.toFixed(1)}%</strong> (credit-weighted) to still land at ${target}% overall.</div>`;
        }
      } else { rebalanceCard.style.display='none'; }
    }
  } else {
    const rebalanceCard = document.getElementById('rebalanceCard');
    if(rebalanceCard) rebalanceCard.style.display='none';
  }
}

/* ---- Archives (saved semester records) ---- */
function renderArchives(){
  app.innerHTML = `
    <div class="backlink" id="backFromArchives">← back to dashboard</div>
    <h1>Saved semesters</h1>
    <p class="sub">Read-only snapshots you've saved — your personal record, independent of what the university shows you.</p>
    <div class="card"><div id="archiveList"><div class="spinner">Loading…</div></div></div>
  `;
  document.getElementById('backFromArchives').onclick = ()=>{ openArchiveView=false; render(); };

  db.collection('users').doc(currentUser.uid).collection('archives').orderBy('savedAt','desc').get().then(snap=>{
    const listEl = document.getElementById('archiveList');
    if(snap.empty){ listEl.innerHTML = `<p style="font-family:-apple-system,sans-serif;color:var(--muted);font-size:0.88rem;">No saved records yet.</p>`; return; }
    listEl.innerHTML='';
    snap.forEach(docSnap=>{
      const a = docSnap.data();
      const dateStr = a.savedAt && a.savedAt.toDate ? a.savedAt.toDate().toLocaleDateString() : '';
      const row = document.createElement('div');
      row.className='archive-row';
      row.innerHTML = `
        <div><strong>${a.name}</strong><br><span style="color:var(--muted);font-size:0.78rem;">${dateStr} · ${a.courses.length} courses</span></div>
        <div style="display:flex;gap:8px;">
          <span class="link" style="margin:0;" data-view="${docSnap.id}">view</span>
          <span class="link" style="margin:0;color:var(--warn);" data-del="${docSnap.id}">delete</span>
        </div>
      `;
      listEl.appendChild(row);
    });
    listEl.querySelectorAll('[data-view]').forEach(el=>{
      el.onclick = ()=> renderArchiveDetail(el.dataset.view);
    });
    listEl.querySelectorAll('[data-del]').forEach(el=>{
      el.onclick = ()=>{
        if(el.textContent==='delete'){ el.textContent='confirm?'; return; }
        db.collection('users').doc(currentUser.uid).collection('archives').doc(el.dataset.del).delete().then(renderArchives);
      };
    });
  });
}

function renderArchiveDetail(archiveId){
  db.collection('users').doc(currentUser.uid).collection('archives').doc(archiveId).get().then(docSnap=>{
    const a = docSnap.data();

    // credit-weighted cumulative across every course in this saved snapshot —
    // same method as the live dashboard's "projected cumulative" figure.
    let totalKnownPoints=0, totalKnownCredits=0;
    const rows = a.courses.map(c=>{
      const proj = courseProjected(c);
      const pct = c.locked ? c.lockedValue : proj;
      if(pct!==null){ totalKnownPoints += (pct/100)*Number(c.credits||0); totalKnownCredits += Number(c.credits||0); }
      return `<div class="field-row"><div class="field-name">${c.name} <span class="field-weight">${c.credits} credits</span></div><div style="font-weight:600;">${pct!==null?pct.toFixed(1)+'%':'—'}</div></div>`;
    }).join('');
    const cumulative = totalKnownCredits>0 ? (totalKnownPoints/totalKnownCredits)*100 : null;

    const cumulativeCardHtml = `
      <div class="card">
        <div class="summary-row">
          <div><div class="summary-big">${cumulative!==null?cumulative.toFixed(1)+'%':'—'}</div><div class="summary-target">overall cumulative (credit-weighted)</div></div>
          ${a.goalsEnabled ? `<div style="text-align:right;"><div class="summary-target">target was ${a.overallTarget}%</div></div>` : ''}
        </div>
      </div>
    `;

    app.innerHTML = `
      <div class="backlink" id="backToArchiveList">← back to saved semesters</div>
      <h1>${a.name}</h1>
      <p class="sub">Saved snapshot — read-only.</p>
      ${cumulativeCardHtml}
      <div class="card">${rows || '<p style="font-family:-apple-system,sans-serif;color:var(--muted);">No courses recorded.</p>'}</div>
    `;
    document.getElementById('backToArchiveList').onclick = renderArchives;
  });
}

/* ---- Course detail / builder screen ---- */
function renderCourseDetail(courseId){
  const course = data.courses.find(c=>c.id===courseId);
  if(!course){ openCourseId=null; render(); return; }
  const goalsOn = !!data.goalsEnabled;

  app.innerHTML = `
    <div class="backlink" id="backBtn">← back to courses</div>
    <div class="card">
      <label>Course name</label>
      <input type="text" class="plain" id="courseNameInput" value="${course.name}">
      <label>Credit weight</label>
      <input type="text" inputmode="decimal" class="plain" id="courseCreditsInput" value="${course.credits}">
      ${goalsOn ? `
        <label>Target for this course (optional — leave blank for automatic)</label>
        <input type="text" inputmode="decimal" class="plain" id="courseTargetInput" placeholder="auto" value="${course.targetOverride ?? ''}">
      ` : ''}
    </div>

    <div id="retakeBanner"></div>

    <div class="card">
      <h2 style="margin-bottom:4px;">Components</h2>
      <p class="sub" style="margin-bottom:12px;">Add whatever this course actually has. For each one: what it's marked out of, and how much it counts toward the final grade.</p>
      <div id="weightSumNote" style="font-family:-apple-system,sans-serif;font-size:0.8rem;color:var(--muted);margin-bottom:10px;"></div>
      <div id="itemList"></div>
      <div class="add-row">
        <input type="text" class="plain name" id="newItemName" placeholder="e.g. CAT 2">
        <input type="text" inputmode="decimal" class="plain num" id="newItemMax" placeholder="marked /">
        <input type="text" inputmode="decimal" class="plain num" id="newItemWeight" placeholder="worth %">
      </div>
      <button class="btn secondary" id="addItemBtn">+ Add component</button>
    </div>

    <div class="card">
      <button class="btn secondary" id="clearMarksBtn" style="width:100%;padding:10px;margin-bottom:10px;">Clear all marks (keep the boxes)</button>
      <div id="clearMarksConfirm"></div>
      <button class="lock-btn ${course.locked?'locked':''}" id="lockBtn" style="width:100%;padding:10px;">${course.locked?'Locked — tap to unlock':'Lock final result'}</button>
    </div>

    <button class="btn danger" id="deleteCourseBtn">Delete this course entirely</button>
    <div id="deleteCourseConfirm"></div>
  `;

  document.getElementById('backBtn').onclick = ()=>{ openCourseId=null; render(); };
  document.getElementById('courseNameInput').addEventListener('input', (e)=>{ course.name=e.target.value; persist(); });
  document.getElementById('courseCreditsInput').addEventListener('input', (e)=>{
    const cleaned = e.target.value.replace(/[^0-9.]/g,'');
    if(cleaned!==e.target.value) e.target.value=cleaned;
    course.credits = parseFloat(cleaned)||0;
    persist();
  });
  if(goalsOn){
    const targetInput = document.getElementById('courseTargetInput');
    targetInput.addEventListener('input', ()=>{
      const cleaned = targetInput.value.replace(/[^0-9.]/g,'');
      if(cleaned!==targetInput.value) targetInput.value=cleaned;
      course.targetOverride = cleaned===''? null : Math.max(0, Math.min(100, parseFloat(cleaned)));
      persist();
      updateItemComputed(course);
    });
  }
  document.getElementById('addItemBtn').onclick = ()=>{
    const nameEl = document.getElementById('newItemName');
    const maxEl = document.getElementById('newItemMax');
    const weightEl = document.getElementById('newItemWeight');
    const name = nameEl.value.trim();
    const rawMax = parseFloat(maxEl.value);
    const weight = parseFloat(weightEl.value);
    if(!name || !rawMax || rawMax<=0 || !weight || weight<=0){ return; }
    course.items.push({ id:uid(), name, rawMax, weight, score:null });
    persist();
    nameEl.value=''; maxEl.value=''; weightEl.value='';
    buildItemList(course);
    updateItemComputed(course);
  };
  document.getElementById('lockBtn').onclick = ()=>{
    if(course.locked){ course.locked=false; course.lockedValue=null; persist(); renderCourseDetail(courseId); return; }
    const hasRealMarks = courseStatus(course).knownWeight > 0;
    if(!hasRealMarks){
      document.getElementById('clearMarksConfirm').innerHTML = `
        <div class="card" style="border-color:var(--warn);background:var(--warn-soft);margin-bottom:10px;">
          <div style="font-family:-apple-system,sans-serif;font-size:0.86rem;color:var(--ink);margin-bottom:10px;">
            No marks are entered yet — locking now would record a final result of 0%, which will drag down what your other courses need.
          </div>
          <div style="display:flex;gap:10px;">
            <button class="btn danger" id="confirmLockZero" style="flex:1;">Lock at 0% anyway</button>
            <button class="btn secondary" id="cancelLockZero" style="flex:1;">Cancel</button>
          </div>
        </div>`;
      document.getElementById('confirmLockZero').onclick = ()=>{ course.locked=true; course.lockedValue=0; persist(); renderCourseDetail(courseId); };
      document.getElementById('cancelLockZero').onclick = ()=>{ document.getElementById('clearMarksConfirm').innerHTML=''; };
      return;
    }
    const proj = courseProjected(course);
    course.locked=true; course.lockedValue = proj!==null?proj:0;
    persist();
    renderCourseDetail(courseId);
  };
  document.getElementById('clearMarksBtn').onclick = ()=>{
    document.getElementById('clearMarksConfirm').innerHTML = `
      <div class="card" style="border-color:var(--warn);background:var(--warn-soft);margin-bottom:10px;">
        <div style="font-family:-apple-system,sans-serif;font-size:0.86rem;color:var(--ink);margin-bottom:10px;">
          This empties every mark in ${course.name} so you can refill them — the components themselves stay exactly as they are.
        </div>
        <div style="display:flex;gap:10px;">
          <button class="btn danger" id="confirmClearMarks" style="flex:1;">Yes, clear marks</button>
          <button class="btn secondary" id="cancelClearMarks" style="flex:1;">Cancel</button>
        </div>
      </div>`;
    document.getElementById('confirmClearMarks').onclick = ()=>{
      course.items.forEach(it=>{ it.score=null; });
      course.locked=false; course.lockedValue=null;
      persist();
      document.getElementById('clearMarksConfirm').innerHTML='';
      buildItemList(course);
      updateItemComputed(course);
      renderCourseDetail(courseId);
    };
    document.getElementById('cancelClearMarks').onclick = ()=>{ document.getElementById('clearMarksConfirm').innerHTML=''; };
  };
  document.getElementById('deleteCourseBtn').onclick = ()=>{
    document.getElementById('deleteCourseConfirm').innerHTML = `
      <div class="card" style="border-color:var(--warn);background:var(--warn-soft);margin-top:8px;">
        <div style="font-family:-apple-system,sans-serif;font-size:0.88rem;color:var(--ink);margin-bottom:10px;">Delete ${course.name} and all its marks? This can't be undone.</div>
        <div style="display:flex;gap:10px;">
          <button class="btn danger" id="confirmDeleteCourse" style="flex:1;">Yes, delete</button>
          <button class="btn secondary" id="cancelDeleteCourse" style="flex:1;">Cancel</button>
        </div>
      </div>`;
    document.getElementById('confirmDeleteCourse').onclick = ()=>{
      data.courses = data.courses.filter(c=>c.id!==courseId);
      persist();
      openCourseId=null;
      render();
    };
    document.getElementById('cancelDeleteCourse').onclick = ()=>{ document.getElementById('deleteCourseConfirm').innerHTML=''; };
  };

  buildItemList(course);
  updateItemComputed(course);
}

function buildItemList(course){
  const listEl = document.getElementById('itemList');
  listEl.innerHTML='';
  course.items.forEach((it,i)=>{
    const row = document.createElement('div');
    row.className='field-row';
    row.innerHTML = `
      <div class="field-name">
        ${it.name} <span class="field-weight">marked out of ${it.rawMax} · worth ${it.weight}% of course</span>
        <span class="field-hint" id="hint-${it.id}"></span>
      </div>
      <div class="field-input">
        <input type="text" inputmode="decimal" autocomplete="off" data-item="${it.id}" value="${it.score ?? ''}" placeholder="—">
        <span>/${it.rawMax}</span>
        <span class="remove-x" data-remove="${it.id}">✕</span>
      </div>
    `;
    listEl.appendChild(row);
  });

  listEl.querySelectorAll('input[data-item]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const cleaned = inp.value.replace(/[^0-9.]/g,'');
      if(cleaned!==inp.value) inp.value=cleaned;
      const item = course.items.find(x=>x.id===inp.dataset.item);
      item.score = cleaned===''? null : parseFloat(cleaned);
      persist();
      updateItemComputed(course);
    });
    inp.addEventListener('blur', ()=>{
      const item = course.items.find(x=>x.id===inp.dataset.item);
      if(item.score!==null){
        const clamped = Math.max(0, Math.min(item.rawMax, item.score));
        if(clamped!==item.score){ item.score=clamped; inp.value=clamped; persist(); updateItemComputed(course); }
      }
    });
  });
  listEl.querySelectorAll('[data-remove]').forEach(x=>{
    x.onclick = ()=>{
      const item = course.items.find(it=>it.id===x.dataset.remove);
      if(item.score===null){
        course.items = course.items.filter(it=>it.id!==x.dataset.remove);
        persist(); buildItemList(course); updateItemComputed(course);
        return;
      }
      x.outerHTML = `<span style="font-family:-apple-system,sans-serif;font-size:0.72rem;color:var(--warn);white-space:nowrap;">
        remove? <span class="link" style="margin:0 4px;" data-confirm-remove="${item.id}">yes</span><span class="link" style="margin:0;" data-cancel-remove="${item.id}">no</span>
      </span>`;
      const yesBtn = listEl.querySelector(`[data-confirm-remove="${item.id}"]`);
      const noBtn = listEl.querySelector(`[data-cancel-remove="${item.id}"]`);
      yesBtn.onclick = ()=>{ course.items = course.items.filter(it=>it.id!==item.id); persist(); buildItemList(course); updateItemComputed(course); };
      noBtn.onclick = ()=>{ buildItemList(course); updateItemComputed(course); };
    };
  });
}

function updateItemComputed(course){
  const goalsOn = !!data.goalsEnabled;
  const autoTarget = goalsOn ? computeAutoTarget(data.overallTarget) : null;
  const courseTarget = goalsOn ? courseTargetFor(course, autoTarget) : null;
  const hasRealMarks = courseStatus(course).knownWeight > 0;

  const weightNote = document.getElementById('weightSumNote');
  if(weightNote){
    const totalWeight = course.items.reduce((s,it)=>s+(Number(it.weight)||0),0);
    if(course.items.length===0){ weightNote.textContent=''; }
    else if(Math.abs(totalWeight-100)<0.01){ weightNote.textContent = `Weights add up to 100% ✓`; weightNote.style.color='var(--accent)'; }
    else { weightNote.textContent = `Weights so far: ${totalWeight}% of 100% — add more components or adjust`; weightNote.style.color='var(--muted)'; }
  }

  const banner = document.getElementById('retakeBanner');
  if(banner){
    const projected = courseProjected(course);
    const currentPct = course.locked ? course.lockedValue : projected;
    let html='';
    if(currentPct!==null && currentPct<50){
      html += `<div class="card" style="border-color:var(--warn);background:var(--warn-soft);">
        <strong style="color:var(--warn);">⚠ Retake risk</strong>
        <div style="font-family:-apple-system,sans-serif;font-size:0.85rem;color:var(--ink);margin-top:4px;">
          ${course.locked ? 'This course is locked' : 'This course is currently tracking'} at ${currentPct.toFixed(0)}% — below the 50% pass mark.
        </div></div>`;
    }
    if(goalsOn && !course.locked && hasRealMarks && targetIsUnsafe(courseTarget)){
      html += `<div class="card" style="border-color:var(--warn);background:var(--warn-soft);">
        <strong style="color:var(--warn);">⚠ Target is below the pass mark</strong>
        <div style="font-family:-apple-system,sans-serif;font-size:0.85rem;color:var(--ink);margin-top:4px;">
          Only ${courseTarget.toFixed(0)}% is mathematically enough for your cumulative — but scoring that here still fails the course. Aim for at least ${PASS_MARK}% specifically in this course.
        </div></div>`;
    }
    banner.innerHTML = html;
  }

  if(!goalsOn || course.locked || courseTarget===null){
    course.items.forEach(it=>{
      const h=document.getElementById('hint-'+it.id);
      if(!h) return;
      if(it.score!==null && it.score!==undefined && it.score!==''){
        const pct = (Number(it.score)/Number(it.rawMax))*100;
        h.textContent = pct<50 ? `⚠ ${pct.toFixed(0)}% on this one — below the pass mark` : '';
        h.style.color='var(--warn)';
      } else { h.textContent=''; }
    });
    return;
  }
  const safeTarget = Math.max(courseTarget, PASS_MARK);
  const need = requiredForRemainingItems(course, courseTarget);
  const needSafe = requiredForRemainingItems(course, safeTarget);
  course.items.forEach((it,i)=>{
    const h = document.getElementById('hint-'+it.id);
    if(!h) return;
    if(it.score!==null && it.score!==undefined && it.score!==''){
      const pct = (Number(it.score)/Number(it.rawMax))*100;
      if(pct<50){ h.textContent = `⚠ ${pct.toFixed(0)}% on this one — below the pass mark`; h.style.color='var(--warn)'; }
      else { h.textContent=''; }
      return;
    }
    const n = need[i];
    if(!n){ h.textContent=''; return; }
    if(n.rate>1){ h.textContent = `need ${it.rawMax}/${it.rawMax} — target not fully reachable here`; h.style.color='var(--warn)'; }
    else if(n.rate<0){ h.textContent = `already on track without this one`; h.style.color='var(--muted)'; }
    else if(hasRealMarks && targetIsUnsafe(courseTarget)){
      const safeN = needSafe[i];
      h.textContent = `${n.rawNeeded.toFixed(1)}/${it.rawMax} is enough for your GPA — aim for ${safeN.rawNeeded.toFixed(1)}/${it.rawMax} to actually pass`;
      h.style.color='var(--warn)';
    } else {
      h.textContent = `need ${n.rawNeeded.toFixed(1)}/${it.rawMax} to stay on pace`;
      h.style.color='var(--accent)';
    }
  });
}

/* ---------- boot ---------- */
auth.onAuthStateChanged(user=>{
  currentUser = user;
  data = null;
  openCourseId = null;
  openArchiveView = false;
  if(user && user.emailVerified){ loadUserData(); }
  else { render(); }
});
</script>
